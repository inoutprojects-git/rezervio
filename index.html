<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title id="page-title">Rezervario — Gestiune Rezervări Pensiune</title>
  <meta name="description" content="PWA pentru gestiunea rezervărilor pensiuni mici. Firebase + React.">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%231e3a5f'>🏠</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1a202c; background: #f0f4f8; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN (hidden when logged in) -->
  <div id="login-screen" style="display:flex;min-height:100vh;background:linear-gradient(135deg, #1e3a5f, #1d4ed8);flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px;">
    <div style="font-size:60px;margin-bottom:20px;">🏠</div>
    <h1 style="color:#fff;font-size:28px;font-weight:800;text-align:center;">Rezervario</h1>
    <p style="color:rgba(255,255,255,.75);font-size:15px;text-align:center;max-width:300px;">Gestione rezervări pensiune — PWA cu Firebase</p>
    
    <!-- Firebase Auth UI injectat aici -->
    <div id="firebaseui-auth-container" style="width:100%;max-width:400px;"></div>
  </div>

  <!-- APP (afisat dupa login) -->
  <div id="root" style="display:none;"></div>

  <!-- REACT CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- FIREBASE CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
  <script src="https://cdn.firebase.com/libs/firebaseui/6.0.0/firebaseui.js"></script>
  <link type="text/css" rel="stylesheet" href="https://cdn.firebase.com/libs/firebaseui/6.0.0/firebaseui.css">

  <!-- APP SCRIPTS (in order) -->
  <script src="js/config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>

  <!-- SERVICE WORKER (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) { console.log('SW register failed:', err); });
    }
  </script>

  <!-- FIREBASE INIT + AUTH UI (first script block) -->
  <script>
    (function() {
      var fbAuth = null;
      var ls = document.getElementById('login-screen');
      var root = document.getElementById('root');
      var appStarted = false;

      // Firebase initialization
      firebase.initializeApp(firebaseConfig);
      fbAuth = firebase.auth();
      firebaseAuth = fbAuth;
      firebaseDB = firebase.database();

      // Setup FirebaseUI
      var uiConfig = {
        callbacks: {
          uiShown: function() { ls.style.display = 'flex'; },
          signInSuccessWithAuthResult: function(authResult, redirectUrl) {
            ls.style.display = 'none';
            root.style.display = 'block';
            return false;
          },
          signInFailure: function(error) {
            console.error('Sign-in failed:', error);
            return Promise.resolve();
          }
        },
        signInFlow: 'popup',
        signInOptions: [
          firebase.auth.EmailAuthProvider.PROVIDER_ID,
          firebase.auth.GoogleAuthProvider.PROVIDER_ID
        ],
        tosUrl: '#',
        privacyPolicyUrl: '#'
      };

      var ui = new firebaseui.auth.AuthUI(fbAuth);
      if (!firebase.auth().currentUser) {
        ui.start('#firebaseui-auth-container', uiConfig);
      }

      // Auth state listener
      function initFirebaseAndAuthUI() {
        fbAuth.onAuthStateChanged(function(user) {
          if (user) {
            firebaseDB.ref('users/' + user.uid).once('value')
              .then(function(snap) {
                var data = snap.val() || {};
                PENSION_ID = data.pensionId || ('p_' + user.uid.slice(0, 8));
                if (!snap.val()) {
                  firebaseDB.ref('users/' + user.uid).set({
                    email: user.email,
                    pensionName: 'Pensiunea Mea',
                    pensionId: PENSION_ID,
                    role: 'admin',
                    createdAt: Date.now()
                  }).catch(function(){});
                }
                ls.style.display = 'none';
                root.style.display = 'block';
                tryStartApp();
              })
              .catch(function() {
                PENSION_ID = 'p_' + user.uid.slice(0, 8);
                ls.style.display = 'none';
                root.style.display = 'block';
                tryStartApp();
              });
          } else {
            var wasRunning = appStarted;
            PENSION_ID = null;
            ls.style.display = 'flex';
            root.style.display = 'none';
            if (wasRunning) {
              setTimeout(function() { window.location.reload(); }, 300);
            }
          }
        });
      }

      function tryStartApp() {
        if (appStarted) return;
        if (typeof window.startApp !== 'function') {
          setTimeout(tryStartApp, 50);
          return;
        }
        appStarted = true;
        window.startApp();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initFirebaseAndAuthUI);
      } else {
        initFirebaseAndAuthUI();
      }
    })();
  </script>
</body>
</html>
