<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1e3a5f"/>
<title>Rezervare Online</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f0f4f8;color:#1a202c;font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
input,select,textarea,button{font-family:inherit;font-size:16px;-webkit-appearance:none;appearance:none;}
button{cursor:pointer;border:none;outline:none;}
button:active{opacity:.8;transform:scale(.97);}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.hdr{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);color:#fff;text-align:center;padding:22px 20px 20px;padding-top:max(22px,env(safe-area-inset-top));}
.hdr-ico{font-size:44px;margin-bottom:8px;}
.hdr-name{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.hdr-sub{font-size:14px;opacity:.75;margin-top:4px;}

.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#64748b;padding:30px;}
.spin{width:48px;height:48px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;}

.err-wrap{text-align:center;padding:40px 24px;}
.err-ico{font-size:56px;margin-bottom:14px;}
.err-title{font-size:20px;font-weight:800;color:#dc2626;margin-bottom:8px;}
.err-msg{font-size:15px;color:#64748b;line-height:1.6;}

.main{max-width:680px;margin:0 auto;padding:18px 14px 80px;}

.steps{display:flex;align-items:center;margin-bottom:22px;padding:0 4px;}
.step-wrap{display:flex;flex-direction:column;align-items:center;flex:1;}
.step-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;transition:all .3s;border:2px solid transparent;}
.step-circle.done{background:#16a34a;color:#fff;border-color:#15803d;}
.step-circle.active{background:#2563eb;color:#fff;box-shadow:0 0 0 5px rgba(37,99,235,.18);}
.step-circle.idle{background:#e2e8f0;color:#94a3b8;}
.step-lbl{font-size:12px;font-weight:600;color:#64748b;margin-top:5px;text-align:center;}
.step-line{flex:1;height:2.5px;background:#e2e8f0;margin-bottom:20px;transition:background .3s;}
.step-line.done{background:#16a34a;}

.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden;animation:fadeUp .3s ease both;}
.card-hdr{padding:16px 18px;background:#f8fafc;border-bottom:1px solid #e8edf2;font-size:17px;font-weight:800;color:#1e3a5f;display:flex;align-items:center;gap:8px;}
.card-body{padding:16px 18px;}

.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.room-card{border:2.5px solid #e2e8f0;border-radius:14px;padding:16px 14px;background:#fff;cursor:pointer;transition:all .2s;text-align:center;}
.room-card.sel{border-color:#2563eb;background:#eff6ff;}
.room-ico{font-size:28px;margin-bottom:8px;}
.room-nm{font-size:15px;font-weight:800;color:#1a202c;margin-bottom:5px;}
.room-price{font-size:16px;color:#2563eb;font-weight:800;}
.room-price.free{color:#94a3b8;font-size:14px;font-weight:600;}
.room-sel-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:#2563eb;color:#fff;padding:3px 9px;border-radius:8px;margin-top:6px;}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
.cal-nav-btn{width:48px;height:48px;border-radius:11px;background:#f1f5f9;border:1.5px solid #e2e8f0;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cal-month{font-size:17px;font-weight:800;color:#1e3a5f;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:#94a3b8;padding:4px 0 6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;position:relative;transition:all .15s;border:2px solid transparent;min-height:44px;}
.cal-day.empty{cursor:default;background:transparent;}
.cal-day.past{color:#d1d5db;cursor:not-allowed;}
.cal-day.occ{background:#fee2e2;color:#dc2626;cursor:not-allowed;}
.cal-day.free{background:#f0fdf4;color:#166534;cursor:pointer;}
.cal-day.free:active{background:#bbf7d0;}
.cal-day.ci{background:#2563eb!important;color:#fff!important;border-color:#1d4ed8;}
.cal-day.inr{background:#dbeafe;color:#1e40af;}
.cal-day.co{background:#16a34a!important;color:#fff!important;border-color:#15803d;}
.cal-day.today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor;}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.cal-leg{display:flex;align-items:center;gap:5px;font-size:13px;color:#64748b;}
.cal-leg-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}

.nights-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.n-btn{width:52px;height:52px;border-radius:12px;background:#f1f5f9;border:1.5px solid #e2e8f0;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.n-num{font-size:28px;font-weight:800;color:#1e3a5f;min-width:40px;text-align:center;}
.n-lbl{font-size:15px;color:#64748b;}

.date-sum{background:#f8fafc;border-radius:12px;padding:14px 16px;border:1.5px solid #e2e8f0;margin-bottom:14px;}
.ds-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px;}
.ds-lbl{color:#64748b;font-weight:600;}
.ds-val{font-weight:800;color:#1a202c;}
.ds-total{border-top:2px solid #e2e8f0;margin-top:8px;padding-top:10px;}
.ds-total-val{font-size:22px;font-weight:800;color:#2563eb;}

.avail-ok{background:#f0fdf4;border:2px solid #86efac;border-radius:11px;padding:12px 15px;font-size:15px;color:#15803d;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.avail-err{background:#fef2f2;border:2px solid #fca5a5;border-radius:11px;padding:12px 15px;font-size:15px;color:#dc2626;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.fgrid.full{grid-template-columns:1fr;}
.fld{display:flex;flex-direction:column;gap:6px;}
.flbl{font-size:13px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;}
.req{color:#dc2626;}
.finp{padding:14px;border:2px solid #d1d9e0;border-radius:11px;font-size:16px;color:#1a202c;background:#fff;width:100%;outline:none;transition:border-color .15s;}
.finp:focus{border-color:#2563eb;}

.sum-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f1f5f9;font-size:15px;}
.sum-row:last-child{border-bottom:none;}
.sum-lbl{color:#64748b;font-weight:600;}
.sum-val{font-weight:800;color:#1a202c;}
.sum-total-row{border-top:2px solid #e2e8f0;margin-top:6px;padding-top:12px;}
.sum-total-val{font-size:22px;font-weight:800;color:#2563eb;}

.btn-primary{width:100%;padding:17px;background:#2563eb;color:#fff;border-radius:13px;font-size:17px;font-weight:800;border:none;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary:disabled{background:#94a3b8;cursor:not-allowed;}
.btn-secondary{width:100%;padding:15px;background:#f1f5f9;color:#374151;border-radius:13px;font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:10px;}

.err-box{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:11px;padding:12px 15px;font-size:14px;color:#dc2626;margin-bottom:12px;display:none;}

.success{text-align:center;padding:36px 20px;animation:pop .5s ease;}
.succ-ico{font-size:80px;margin-bottom:16px;}
.succ-title{font-size:26px;font-weight:800;color:#16a34a;margin-bottom:10px;}
.succ-sub{font-size:16px;color:#64748b;line-height:1.65;margin-bottom:26px;}
.succ-card{background:#f0fdf4;border:2px solid #86efac;border-radius:14px;padding:18px;text-align:left;margin-bottom:20px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-ico">🏡</div>
  <div class="hdr-name" id="prop-name">Pensiune</div>
  <div class="hdr-sub">Rezervare online • Simplu și rapid</div>
</div>

<div id="app">
  <div class="loading"><div class="spin"></div><div style="font-size:16px;font-weight:600">Se încarcă disponibilitatea...</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>

<script>
(function() {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var pensionId = params.get('p');
  var db = null;
  var appRooms = [];
  var roomPrices = {};
  var wholeEnabled = false;
  var reservations = [];

  function E(id) { return document.getElementById(id); }
  function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function monthDays(y, m) { var days = [], d = new Date(y, m, 1); while (d.getMonth() === m) { days.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); } return days; }

  function showError(msg) {
    E('app').innerHTML = '<div class="err-wrap"><div class="err-ico">\u26A0\uFE0F</div><div class="err-title">Eroare</div><div class="err-msg">' + msg + '</div></div>';
  }

  if (!pensionId) { showError('Link invalid — lipseste identificatorul pensiunii.'); return; }

  var S = { step: 1, room: null, checkIn: null, nights: 1 };
  var calY = new Date().getFullYear();
  var calM = new Date().getMonth();

  function render() {
    E('app').innerHTML = buildSteps() + buildStep();
  }

  function buildSteps() {
    var labels = ['Camera', 'Data', 'Date', 'Confirmare'];
    var html = '<div class="steps">';
    for (var i = 1; i <= 4; i++) {
      var cls = i < S.step ? 'done' : i === S.step ? 'active' : 'idle';
      var txt = i < S.step ? '\u2713' : i;
      html += '<div class="step-wrap"><div class="step-circle ' + cls + '">' + txt + '</div><div class="step-lbl">' + labels[i - 1] + '</div></div>';
      if (i < 4) { var lineCls = i < S.step ? 'done' : ''; html += '<div class="step-line ' + lineCls + '"></div>'; }
    }
    return html + '</div>';
  }

  function buildStep() {
    if (S.step === 1) return buildStep1();
    if (S.step === 2) return buildStep2();
    if (S.step === 3) return buildStep3();
    if (S.step === 4) return buildStep4();
    return '';
  }

  function buildStep1() {
    var icons = ['\uD83D\uDECF', '\uD83C\uDFE0', '\uD83D\uDEAA', '\uD83C\uDFD8', '\uD83D\uDECB', '\uD83C\uDFE1', '\uD83C\uDF19', '\u2B50'];
    var html = '<div class="card"><div class="card-hdr">\uD83D\uDEAA Alege camera</div><div class="card-body"><div class="room-grid">';

    if (wholeEnabled && roomPrices[WHOLE] > 0) {
      var isWholeSel = S.room === WHOLE;
      html += '<div class="room-card' + (isWholeSel ? ' sel' : '') + '" onclick="RB.selectRoom(\'' + WHOLE + '\')" style="grid-column:1/-1;border-color:' + (isWholeSel ? '#2563eb' : '#fbbf24') + ';background:' + (isWholeSel ? '#eff6ff' : '#fffbeb') + '">';
      html += '<div class="room-ico">\uD83C\uDFE1</div><div class="room-nm" style="color:#92400e">Toat\u0103 loca\u021bia</div>';
      html += '<div style="font-size:13px;color:#78350f;margin-bottom:5px">Toate camerele — uz exclusiv</div>';
      html += '<div class="room-price" style="color:#d97706">' + roomPrices[WHOLE] + ' lei/noapte</div>';
      if (isWholeSel) html += '<div class="room-sel-tag" style="background:#d97706">\u2713 Selectat\u0103</div>';
      html += '</div><div style="grid-column:1/-1;height:1px;background:#e2e8f0;margin:4px 0"></div>';
    }

    appRooms.forEach(function(room, idx) {
      var price = roomPrices[room] || 0;
      var isSel = S.room === room;
      var ico = icons[idx % icons.length];
      html += '<div class="room-card' + (isSel ? ' sel' : '') + '" onclick="RB.selectRoom(\'' + escHtml(room) + '\')">';
      html += '<div class="room-ico">' + ico + '</div><div class="room-nm">' + escHtml(room) + '</div>';
      html += price > 0 ? '<div class="room-price">' + price + ' lei/noapte</div>' : '<div class="room-price free">Pre\u021b la cerere</div>';
      if (isSel) html += '<div class="room-sel-tag">\u2713 Selectat\u0103</div>';
      html += '</div>';
    });

    html += '</div></div></div>';
    html += '<button class="btn-primary" onclick="RB.goStep(2)" ' + (S.room ? '' : 'disabled') + '>Continu\u0103 \u2192 Alege data</button>';
    return html;
  }

  function buildStep2() {
    var html = '<div class="card"><div class="card-hdr">\uD83D\uDCC5 Alege data de check-in</div><div class="card-body">';
    html += buildCalendar();
    html += '</div></div>';
    if (S.checkIn) html += buildNightsCard();
    var canContinue = S.checkIn && !checkConflict();
    html += '<button class="btn-primary" ' + (canContinue ? '' : 'disabled') + ' onclick="RB.goStep(3)">Continu\u0103 \u2192 Datele tale</button>';
    html += '<button class="btn-secondary" onclick="RB.goStep(1)">\u2190 Schimb\u0103 camera</button>';
    return html;
  }

  function buildCalendar() {
    var days = monthDays(calY, calM);
    var firstDow = new Date(calY, calM, 1).getDay();
    var offset = firstDow === 0 ? 6 : firstDow - 1;
    var mn = new Date(calY, calM, 1).toLocaleString('ro-RO', { month: 'long', year: 'numeric' });
    var title = mn.charAt(0).toUpperCase() + mn.slice(1);
    var occ = getOccupied();
    var tod = todayStr();
    var checkOut = S.checkIn ? addDays(S.checkIn, S.nights) : null;

    var html = '<div class="cal-nav"><button class="cal-nav-btn" onclick="RB.calPrev()">\u25C0</button><span class="cal-month">' + title + '</span><button class="cal-nav-btn" onclick="RB.calNext()">\u25B6</button></div>';
    html += '<div class="cal-dow-row">';
    ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', '<span style="color:#2563eb">Sb</span>', '<span style="color:#2563eb">Du</span>'].forEach(function(d) { html += '<div class="cal-dow">' + d + '</div>'; });
    html += '</div><div class="cal-grid">';
    for (var e = 0; e < offset; e++) html += '<div class="cal-day empty"></div>';

    days.forEach(function(day) {
      var dd = parseInt(day.slice(8));
      var cls = ['cal-day'];
      var onclick = '';
      var isToday = day === tod;
      if (day < tod) { cls.push('past'); }
      else if (occ[day]) { cls.push('occ'); }
      else if (S.checkIn && day === S.checkIn) { cls.push('ci'); onclick = ' onclick="RB.selectCI(\'' + day + '\')"'; }
      else if (S.checkIn && checkOut && day > S.checkIn && day < checkOut) { cls.push('inr'); }
      else if (S.checkIn && day === checkOut) { cls.push('co'); }
      else { cls.push('free'); onclick = ' onclick="RB.selectCI(\'' + day + '\')"'; }
      if (isToday) cls.push('today');
      html += '<div class="' + cls.join(' ') + '"' + onclick + '>' + dd + '</div>';
    });

    html += '</div><div class="cal-legend">';
    html += '<div class="cal-leg"><div class="cal-leg-dot" style="background:#f0fdf4;border:1.5px solid #16a34a"></div>Disponibil</div>';
    html += '<div class="cal-leg"><div class="cal-leg-dot" style="background:#fee2e2"></div>Ocupat</div>';
    html += '</div>';
    return html;
  }

  function buildNightsCard() {
    var checkOut = addDays(S.checkIn, S.nights);
    var price = roomPrices[S.room] || 0;
    var total = price * S.nights;
    var conflict = checkConflict();
    var html = '<div class="card"><div class="card-hdr">\uD83C\uDF19 Num\u0103r de nop\u021bi</div><div class="card-body">';
    html += '<div class="nights-row"><button class="n-btn" onclick="RB.changeN(-1)">\u2212</button><span class="n-num">' + S.nights + '</span><span class="n-lbl">nop\u021bi</span><button class="n-btn" onclick="RB.changeN(1)">+</button></div>';
    html += conflict ? '<div class="avail-err">\u26A0\uFE0F Perioada nu este disponibil\u0103. Alege alte date.</div>' : '<div class="avail-ok">\u2713 Perioada este disponibil\u0103!</div>';
    html += '<div class="date-sum">';
    html += '<div class="ds-row"><span class="ds-lbl">Check-in</span><span class="ds-val">' + fmt(S.checkIn) + '</span></div>';
    html += '<div class="ds-row"><span class="ds-lbl">Check-out</span><span class="ds-val">' + fmt(checkOut) + '</span></div>';
    html += '<div class="ds-row"><span class="ds-lbl">Nop\u021bi</span><span class="ds-val">' + S.nights + '</span></div>';
    html += '<div class="ds-row ds-total"><span class="ds-lbl" style="font-weight:800;color:#1a202c">Total estimat</span><span class="ds-total-val">' + (total > 0 ? total + ' lei' : 'La cerere') + '</span></div>';
    html += '</div></div></div>';
    return html;
  }

  function getOccupied() {
    var occ = {};
    reservations.forEach(function(r) {
      if (r.status === 'cancelled') return;
      var affectsRoom = r.room === S.room || r.room === WHOLE || S.room === WHOLE;
      if (!affectsRoom) return;
      for (var i = 0; i < (r.nights || 0); i++) { occ[addDays(r.checkIn, i)] = true; }
    });
    return occ;
  }

  function checkConflict() {
    if (!S.checkIn || !S.nights || !S.room) return false;
    return reservations.some(function(r) {
      return r.status !== 'cancelled' && (r.room === S.room || r.room === WHOLE || S.room === WHOLE) && overlaps(S.checkIn, S.nights, r.checkIn, r.nights || 0);
    });
  }

  function buildStep3() {
    var price = roomPrices[S.room] || 0;
    var total = price * S.nights;
    var checkOut = addDays(S.checkIn, S.nights);

    var html = '<div class="card"><div class="card-hdr">\uD83D\uDC64 Datele tale</div><div class="card-body">';
    html += '<div class="fgrid"><div class="fld"><label class="flbl">Prenume <span class="req">*</span></label><input class="finp" id="f-fn" type="text" placeholder="Ion" autocomplete="given-name"/></div>';
    html += '<div class="fld"><label class="flbl">Nume <span class="req">*</span></label><input class="finp" id="f-ln" type="text" placeholder="Popescu" autocomplete="family-name"/></div></div>';
    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Telefon <span class="req">*</span></label><input class="finp" id="f-ph" type="tel" placeholder="07xx xxx xxx" autocomplete="tel"/></div></div>';
    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Mesaj / cerin\u021be speciale</label><textarea class="finp" id="f-cm" placeholder="Ex: sosim dup\u0103 ora 18..." rows="3" style="resize:vertical"></textarea></div></div>';
    html += '</div></div>';

    html += '<div class="card"><div class="card-hdr">\uD83D\uDCCB Rezumat rezervare</div><div class="card-body">';
    html += '<div class="sum-row"><span class="sum-lbl">Camera</span><span class="sum-val">' + escHtml(S.room === WHOLE ? 'Toat\u0103 loca\u021bia' : S.room) + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Check-in</span><span class="sum-val">' + fmt(S.checkIn) + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Check-out</span><span class="sum-val">' + fmt(checkOut) + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Nop\u021bi</span><span class="sum-val">' + S.nights + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Tarif/noapte</span><span class="sum-val">' + (price > 0 ? price + ' lei' : 'La cerere') + '</span></div>';
    html += '<div class="sum-row sum-total-row"><span class="sum-lbl" style="font-weight:800;color:#1a202c">TOTAL DE ACHITAT</span><span class="sum-total-val">' + (total > 0 ? total + ' lei' : 'Va fi comunicat') + '</span></div>';
    html += '</div></div>';

    html += '<div class="err-box" id="form-err"></div>';
    html += '<button class="btn-primary" onclick="RB.submitReservation()">\u2713 Trimite cererea de rezervare</button>';
    html += '<button class="btn-secondary" onclick="RB.goStep(2)">\u2190 Schimb\u0103 data</button>';
    return html;
  }

  function buildStep4() {
    var price = roomPrices[S.room] || 0;
    var total = price * S.nights;
    var checkOut = addDays(S.checkIn, S.nights);
    var html = '<div class="success"><div class="succ-ico">\uD83C\uDF89</div><div class="succ-title">Cerere trimis\u0103!</div>';
    html += '<div class="succ-sub">Rezervarea ta a fost \u00eenregistrat\u0103 cu succes.<br>Vei fi contactat \u00een cur\u00e2nd pentru confirmare.</div>';
    html += '<div class="succ-card">';
    html += '<div class="sum-row"><span class="sum-lbl">Nume</span><span class="sum-val">' + escHtml(S.guestName || '') + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Camera</span><span class="sum-val">' + escHtml(S.room === WHOLE ? 'Toat\u0103 loca\u021bia' : S.room) + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Check-in</span><span class="sum-val">' + fmt(S.checkIn) + '</span></div>';
    html += '<div class="sum-row"><span class="sum-lbl">Check-out</span><span class="sum-val">' + fmt(checkOut) + '</span></div>';
    if (total > 0) html += '<div class="sum-row sum-total-row"><span class="sum-lbl" style="font-weight:800">Total</span><span class="sum-total-val">' + total + ' lei</span></div>';
    html += '</div><button class="btn-primary" onclick="location.reload()">\uD83D\uDD04 Rezervare nou\u0103</button></div>';
    return html;
  }

  window.RB = {
    selectRoom: function(room) { S.room = room; render(); },
    selectCI: function(day) { S.checkIn = day; S.nights = 1; render(); },
    calPrev: function() { calM--; if (calM < 0) { calM = 11; calY--; } render(); },
    calNext: function() { calM++; if (calM > 11) { calM = 0; calY++; } render(); },
    changeN: function(d) { S.nights = Math.max(1, S.nights + d); render(); },
    goStep: function(n) { S.step = n; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    submitReservation: function() {
      var fn = (E('f-fn') || {}).value || '';
      var ln = (E('f-ln') || {}).value || '';
      var ph = (E('f-ph') || {}).value || '';
      var cm = (E('f-cm') || {}).value || '';
      fn = fn.trim(); ln = ln.trim(); ph = ph.trim();

      var errEl = E('form-err');
      if (!fn) { showFormErr('Introdu prenumele.'); return; }
      if (!ln) { showFormErr('Introdu numele.'); return; }
      if (!ph) { showFormErr('Introdu num\u0103rul de telefon.'); return; }
      if (errEl) errEl.style.display = 'none';

      var btn = document.querySelector('.btn-primary');
      if (btn) { btn.disabled = true; btn.textContent = '\u23F3 Se trimite...'; }

      var price = roomPrices[S.room] || 0;
      var newResRef = db.ref('pensions/' + pensionId + '/reservations').push();
      newResRef.set({
        room: S.room, firstName: fn, lastName: ln, phone: ph,
        checkIn: S.checkIn, nights: S.nights, pricePerNight: price, advance: 0,
        source: 'Site Rezervari', status: 'pending', comments: cm,
        pendingConfirmation: true, createdAt: Date.now()
      }).then(function() {
        return db.ref('pensions/' + pensionId + '/blockedDates/' + newResRef.key).set({ room: S.room, checkIn: S.checkIn, nights: S.nights }).catch(function() {});
      }).then(function() {
        S.guestName = fn + ' ' + ln;
        S.step = 4;
        render();
      }).catch(function(e) {
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Trimite cererea de rezervare'; }
        showFormErr('Eroare la trimitere: ' + e.message);
      });
    }
  };

  function showFormErr(msg) { var el = E('form-err'); if (el) { el.textContent = msg; el.style.display = 'block'; } }

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  auth.signInAnonymously().then(function() {
    db = firebase.database();
    return db.ref('pensions/' + pensionId + '/config').once('value');
  }).then(function(snap) {
    var cfg = snap.val();
    if (!cfg) { showError('Aceast\u0103 pensiune nu a fost g\u0103sit\u0103.'); return; }
    appRooms = cfg.rooms || [];
    roomPrices = cfg.roomPrices || {};
    wholeEnabled = cfg.wholeEnabled !== false;
    var nameEl = E('prop-name');
    if (nameEl) nameEl.textContent = cfg.pensionName || 'Pensiune';
    document.title = 'Rezervare — ' + (cfg.pensionName || 'Pensiune');

    if (appRooms.length === 0) {
      E('app').innerHTML = '<div class="err-wrap"><div class="err-ico">\uD83D\uDEA7</div><div class="err-title">Rezerv\u0103ri indisponibile</div><div class="err-msg">Aceast\u0103 pensiune nu are \u00eenc\u0103 camere configurate.</div></div>';
      return;
    }

    db.ref('pensions/' + pensionId + '/blockedDates').on('value', function(s) {
      var data = s.val() || {};
      reservations = Object.keys(data).map(function(id) { return Object.assign({}, data[id], { id: id }); });
      if (S.step === 2) render();
    });

    render();
  }).catch(function(e) {
    showError('Eroare la conectare: ' + e.message);
  });

})();
</script>
</body>
</html>
