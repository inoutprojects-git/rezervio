<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1e3a5f"/>
<title>Date facturare</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f0f4f8;color:#1a202c;font-size:16px;line-height:1.55;padding-bottom:40px;}
input,select,textarea{font-family:inherit;font-size:16px!important;-webkit-appearance:none;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}
button:active{opacity:.8;transform:scale(.97);}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.hdr{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);color:#fff;text-align:center;padding:24px 20px;padding-top:max(24px,env(safe-area-inset-top));}
.hdr-ico{font-size:42px;margin-bottom:8px;}
.hdr-title{font-size:22px;font-weight:800;}
.hdr-sub{font-size:14px;opacity:.75;margin-top:4px;}

.main{max-width:680px;margin:0 auto;padding:16px 14px 40px;}

.info-card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:16px 18px;margin-bottom:16px;animation:fadeUp .3s ease;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:15px;border-bottom:1px solid #f1f5f9;}
.info-row:last-child{border-bottom:none;}
.info-lbl{color:#64748b;font-weight:600;}
.info-val{font-weight:800;color:#1a202c;}

.ibox{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:11px;padding:12px 15px;font-size:14px;color:#1e40af;margin-bottom:16px;line-height:1.6;}

.form-card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:18px 16px;margin-bottom:14px;animation:fadeUp .25s ease both;}
.form-title{font-size:16px;font-weight:800;color:#1e3a5f;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.fgrid.full{grid-template-columns:1fr;}
.fld{display:flex;flex-direction:column;gap:5px;}
.flbl{font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;}
.req{color:#dc2626;}
.finp{padding:12px;border:2px solid #d1d9e0;border-radius:10px;font-size:16px;color:#1a202c;background:#fff;width:100%;outline:none;transition:border-color .15s;}
.finp:focus{border-color:#2563eb;}

.cui-row{display:flex;gap:8px;align-items:flex-start;}
.cui-btn{padding:12px 14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.cui-btn:disabled{background:#94a3b8;}
.cui-ok{color:#16a34a;font-size:13px;font-weight:700;margin-top:4px;}
.cui-err{color:#dc2626;font-size:13px;font-weight:700;margin-top:4px;}

.btn-submit{width:100%;padding:17px;background:#2563eb;color:#fff;border-radius:13px;font-size:17px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed;}

.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#64748b;}
.spin{width:46px;height:46px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;}

.success{text-align:center;padding:40px 20px;animation:pop .5s ease;}
.succ-ico{font-size:80px;margin-bottom:16px;}
.succ-title{font-size:26px;font-weight:800;color:#16a34a;margin-bottom:10px;}
.succ-sub{font-size:16px;color:#64748b;line-height:1.65;}

.err-box{display:none;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:12px;font-size:14px;color:#dc2626;margin-bottom:12px;}
.err-page{text-align:center;padding:40px 20px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-ico">🧾</div>
  <div class="hdr-title" id="pension-name">Date facturare</div>
  <div class="hdr-sub">Completați datele firmei pentru factură</div>
</div>

<div id="app" class="main">
  <div class="loading"><div class="spin"></div><div style="font-size:16px;font-weight:600">Se încarcă...</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>

<script>
(function() {
  'use strict';

  var params = new URLSearchParams(window.location.href.split('?')[1] || '');
  var pensionId = params.get('p');
  var resId = params.get('r');
  var db = null;
  var reservation = null;

  var billingData = {
    companyName: '', cui: '', regNo: '', address: '', city: '', county: '',
    country: 'Romania', email: '', contactName: '', cuiValid: null, cuiLoading: false
  };

  function E(id) { return document.getElementById(id); }
  function escH(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function update(field, val) { billingData[field] = val; if (field === 'cui') billingData.cuiValid = null; }

  if (!pensionId || !resId) {
    E('app').innerHTML = '<div class="err-page"><div style="font-size:56px;margin-bottom:14px">\u26A0\uFE0F</div><div style="font-size:18px;font-weight:700;color:#dc2626">Link invalid</div><div style="font-size:15px;color:#64748b;margin-top:8px">Contacta\u021bi pensiunea pentru un link valid.</div></div>';
    return;
  }

  function render() {
    var checkOut = addDays(reservation.checkIn, reservation.nights || 0);
    var existing = reservation.billingDetails || {};
    Object.keys(existing).forEach(function(k) { if (billingData.hasOwnProperty(k)) billingData[k] = existing[k]; });
    var alreadyFilled = existing.companyName;

    var html = '';
    html += '<div class="info-card">';
    html += '<div class="info-row"><span class="info-lbl">Camera</span><span class="info-val">' + escH(reservation.room || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Check-in</span><span class="info-val">' + fmt(reservation.checkIn) + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Check-out</span><span class="info-val">' + fmt(checkOut) + '</span></div>';
    html += '</div>';

    if (alreadyFilled) {
      html += '<div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:11px;padding:12px 15px;font-size:14px;color:#15803d;margin-bottom:16px;">\u2705 Datele de facturare au fost deja transmise. Pute\u021bi modifica \u0219i retrimite mai jos.</div>';
    }

    html += '<div class="ibox">\uD83E\uDDFE Completa\u021bi datele firmei pe care dori\u021bi s\u0103 apar\u0103 pe factur\u0103. C\u00e2mpurile marcate cu <span style="color:#dc2626">*</span> sunt obligatorii.</div>';

    html += '<div class="form-card"><div class="form-title">\uD83C\uDFE2 Date firm\u0103</div>';
    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Denumire firm\u0103 <span class="req">*</span></label>';
    html += '<input class="finp" value="' + escH(billingData.companyName) + '" placeholder="SC Exemplu SRL" oninput="FB.update(\'companyName\',this.value)"/></div></div>';

    html += '<div class="fgrid"><div class="fld"><label class="flbl">CUI / CIF <span class="req">*</span></label><div class="cui-row">';
    html += '<input class="finp" value="' + escH(billingData.cui) + '" placeholder="RO12345678" oninput="FB.update(\'cui\',this.value)"/>';
    html += '<button class="cui-btn" ' + (billingData.cuiLoading ? 'disabled' : '') + ' onclick="FB.verifyCUI()">' + (billingData.cuiLoading ? '\u23F3' : '\uD83D\uDD0D Verific\u0103') + '</button></div>';
    if (billingData.cuiValid === true) html += '<div class="cui-ok">\u2713 CUI valid</div>';
    if (billingData.cuiValid === false) html += '<div class="cui-err">\u26A0\uFE0F CUI neg\u0103sit sau invalid</div>';
    html += '</div><div class="fld"><label class="flbl">Nr. \u00eenregistrare</label>';
    html += '<input class="finp" value="' + escH(billingData.regNo) + '" placeholder="J12/345/2020" oninput="FB.update(\'regNo\',this.value)"/></div></div>';

    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Adres\u0103 sediu social <span class="req">*</span></label>';
    html += '<input class="finp" value="' + escH(billingData.address) + '" placeholder="Str. Exemplu, nr. 1" oninput="FB.update(\'address\',this.value)"/></div></div>';

    html += '<div class="fgrid"><div class="fld"><label class="flbl">Localitate <span class="req">*</span></label>';
    html += '<input class="finp" value="' + escH(billingData.city) + '" placeholder="Bucure\u0219ti" oninput="FB.update(\'city\',this.value)"/></div>';
    html += '<div class="fld"><label class="flbl">Jude\u021b</label>';
    html += '<input class="finp" value="' + escH(billingData.county) + '" placeholder="Ilfov" oninput="FB.update(\'county\',this.value)"/></div></div>';

    html += '<div class="fgrid"><div class="fld"><label class="flbl">\u021aar\u0103</label>';
    html += '<input class="finp" value="' + escH(billingData.country) + '" oninput="FB.update(\'country\',this.value)"/></div></div>';
    html += '</div>';

    html += '<div class="form-card"><div class="form-title">\uD83D\uDCE7 Contact (op\u021bional)</div>';
    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Persoan\u0103 de contact</label>';
    html += '<input class="finp" value="' + escH(billingData.contactName) + '" placeholder="Nume Prenume" oninput="FB.update(\'contactName\',this.value)"/></div></div>';
    html += '<div class="fgrid full"><div class="fld"><label class="flbl">Email pentru factur\u0103</label>';
    html += '<input class="finp" type="email" value="' + escH(billingData.email) + '" placeholder="contabilitate@firma.ro" oninput="FB.update(\'email\',this.value)"/></div></div>';
    html += '</div>';

    html += '<div id="form-err" class="err-box"></div>';
    html += '<button class="btn-submit" id="btn-submit" onclick="FB.submitForm()">\u2713 Trimite datele de facturare</button>';

    E('app').innerHTML = html;
  }

  window.FB = {
    update: update,

    verifyCUI: function() {
      var cui = billingData.cui.replace(/[^0-9]/g, '');
      if (!cui) return;
      billingData.cuiLoading = true; billingData.cuiValid = null;
      render();
      fetch('https://webservicesp.anaf.ro/PlatitorTvaRest/api/v8/ws/tva', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([{ cui: parseInt(cui), data: new Date().toISOString().slice(0, 10) }])
      }).then(function(r) { return r.json(); }).then(function(data) {
        billingData.cuiLoading = false;
        var found = data && data.found && data.found.length > 0 ? data.found[0] : null;
        if (found && found.date_generale) {
          billingData.cuiValid = true;
          var d = found.date_generale;
          if (!billingData.companyName && d.denumire) billingData.companyName = d.denumire;
          if (!billingData.address && d.adresa) billingData.address = d.adresa;
        } else {
          billingData.cuiValid = false;
        }
        render();
      }).catch(function() { billingData.cuiLoading = false; billingData.cuiValid = false; render(); });
    },

    submitForm: function() {
      var errors = [];
      if (!billingData.companyName.trim()) errors.push('Denumirea firmei este obligatorie');
      if (!billingData.cui.trim()) errors.push('CUI / CIF este obligatoriu');
      if (!billingData.address.trim()) errors.push('Adresa sediului social este obligatorie');
      if (!billingData.city.trim()) errors.push('Localitatea este obligatorie');

      var errEl = E('form-err');
      if (errors.length > 0) { errEl.innerHTML = errors.join('<br>'); errEl.style.display = 'block'; errEl.scrollIntoView({ behavior: 'smooth' }); return; }
      errEl.style.display = 'none';

      var btn = E('btn-submit');
      btn.disabled = true; btn.textContent = '\u23F3 Se trimite...';

      var dataToSave = {
        companyName: billingData.companyName, cui: billingData.cui, regNo: billingData.regNo,
        address: billingData.address, city: billingData.city, county: billingData.county,
        country: billingData.country, email: billingData.email, contactName: billingData.contactName,
        completedAt: Date.now(), completedBy: 'client'
      };

      db.ref('pensions/' + pensionId + '/reservations/' + resId + '/billingDetails').set(dataToSave)
        .then(function() {
          E('app').innerHTML = '<div class="success"><div class="succ-ico">\uD83C\uDF89</div><div class="succ-title">Mul\u021bumim!</div>' +
            '<div class="succ-sub">Datele de facturare au fost transmise cu succes.<br><br>' +
            '<strong>' + escH(billingData.companyName) + '</strong><br>CUI: ' + escH(billingData.cui) + '<br><br>' +
            'Vom emite factura \u0219i o vom trimite la adresa indicat\u0103.</div></div>';
        }).catch(function(e) {
          btn.disabled = false; btn.textContent = '\u2713 Trimite datele de facturare';
          errEl.textContent = 'Eroare la trimitere: ' + e.message; errEl.style.display = 'block';
        });
    }
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  auth.signInAnonymously().then(function() {
    db = firebase.database();
    return db.ref('pensions/' + pensionId + '/config').once('value');
  }).then(function(snap) {
    var cfg = snap.val() || {};
    if (cfg.pensionName) {
      E('pension-name').textContent = cfg.pensionName;
      document.title = 'Date facturare — ' + cfg.pensionName;
    }
    return db.ref('pensions/' + pensionId + '/reservations/' + resId).once('value');
  }).then(function(snap) {
    var data = snap.val();
    if (!data) {
      E('app').innerHTML = '<div class="err-page"><div style="font-size:56px;margin-bottom:14px">\uD83D\uDD0D</div><div style="font-size:18px;font-weight:700;color:#dc2626">Rezervare negasit\u0103</div></div>';
      return;
    }
    reservation = data;
    render();
  }).catch(function(e) {
    E('app').innerHTML = '<div class="err-page"><div style="font-size:48px;margin-bottom:14px">\u26A0\uFE0F</div><div style="font-size:16px;color:#dc2626">' + e.message + '</div></div>';
  });

})();
</script>
</body>
</html>
